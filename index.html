<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma Pruebitas — Química Orgánica FCEFyN-UNC</title>
<style>
  :root{
    --bg:#faf8f5; --ink:#2b2620; --muted:#6b6355; --line:#d8cfc0;
    --accent:#3d3527; --accent-ink:#faf8f5; --ok:#2f5c2a; --ok-bg:#eef3ea; --ok-line:#c9dbc0;
    --warn:#7a2f1f; --warn-bg:#f5e9e6; --warn-line:#e0bdb4;
  }
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:0;line-height:1.5;}
  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 80px;}
  h1{font-size:1.4rem;margin:0 0 4px;}
  h2{font-size:1.15rem;margin:0 0 12px;}
  .sub{color:var(--muted);font-size:0.92rem;margin-bottom:22px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
  .com-btn{display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;text-align:left;font-size:1rem;font-family:inherit;color:var(--ink);}
  .com-btn:hover{border-color:var(--accent);}
  .com-btn[disabled]{opacity:0.55;cursor:not-allowed;}
  .badge{font-size:0.72rem;padding:2px 8px;border-radius:999px;font-weight:600;letter-spacing:.02em;}
  .badge.on{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line);}
  .badge.off{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line);}
  button.primary{background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;padding:11px 18px;font-size:0.95rem;cursor:pointer;}
  button.primary:hover{opacity:0.92;}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);border-radius:8px;padding:9px 16px;font-size:0.9rem;cursor:pointer;}
  button.ghost:hover{border-color:var(--accent);}
  input[type=text], input[type=number], textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:0.95rem;background:#fffdfb;
  }
  textarea{min-height:70px;resize:vertical;}
  label{display:block;font-weight:600;margin-bottom:6px;font-size:0.92rem;}
  .field{margin-bottom:16px;}
  .qtitle{font-weight:700;margin-bottom:8px;}
  .points{font-weight:600;font-style:italic;color:var(--muted);font-size:0.85rem;}
  .opt{display:flex;align-items:flex-start;gap:8px;padding:6px 0;cursor:pointer;font-size:0.94rem;}
  .opt input{margin-top:3px;}
  img.graph{max-width:280px;display:block;margin:10px 0;border:1px solid var(--line);border-radius:6px;}
  .notice{padding:12px 14px;border-radius:10px;font-size:0.88rem;margin-bottom:16px;}
  .notice.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);}
  .notice.ok{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok);}
  .toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);}
  .toggle-row:last-child{border-bottom:none;}
  .switch{position:relative;width:44px;height:24px;flex:none;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background:#d8cfc0;border-radius:999px;transition:.15s;}
  .slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
  input:checked + .slider{background:var(--ok);}
  input:checked + .slider:before{transform:translateX(20px);}
  .backlink{background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.88rem;padding:0;margin-bottom:14px;text-decoration:underline;}
  code{background:#f0ece4;padding:1px 5px;border-radius:4px;font-size:0.85em;}
  .qsection{border-top:1px dashed var(--line);padding-top:16px;margin-top:16px;}
</style>
</head>

/* NOTA DE FIDELIDAD: comisión 9 conserva la misma inconsistencia de orden de letras (d,c,b,a) que tenía TEMA 7 antes de
   la corrección, porque no se pidió corregirla — acá se muestra directamente en el orden de opciones, sin letras, así
   que ese defecto puntual de rotulado ya no aplica visualmente, pero el contenido es fiel al original en todo lo demás. */

/* ============ ESTADO ============ */
let STATE = { view:"landing", comision:null, docente:false, answers:{} };
let ENABLED = {5:false,6:false,7:false,8:false,9:false,10:false}; // default: todo deshabilitado hasta que el docente lo active

async function tryLoadSharedConfig(){
  if (window.storage) {
    try {
      const r = await window.storage.get("comisiones_habilitadas", true);
      if (r && r.value) ENABLED = JSON.parse(r.value);
    } catch(e) { /* no existe aún, se usa el default */ }
  } else if (CONFIG.APPS_SCRIPT_URL) {
    try {
      const resp = await fetch(CONFIG.APPS_SCRIPT_URL + "?action=getConfig");
      const data = await resp.json();
      if (data && data.enabled) ENABLED = data.enabled;
    } catch(e) { console.warn("No se pudo leer config del backend:", e); }
  }
}

async function saveSharedConfig(){
  if (window.storage) {
    try { await window.storage.set("comisiones_habilitadas", JSON.stringify(ENABLED), true); } catch(e){}
  }
  if (CONFIG.APPS_SCRIPT_URL) {
    try {
      await fetch(CONFIG.APPS_SCRIPT_URL, {
        method:"POST", headers:{"Content-Type":"text/plain"},
        body: JSON.stringify({ action:"setConfig", enabled: ENABLED })
      });
    } catch(e) { console.warn("No se pudo guardar config en el backend:", e); }
  }
}

/* ============ RENDER ============ */
const app = document.getElementById("app");

function el(tag, attrs, children){
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === "class") e.className = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c => { if (c) e.appendChild(c); });
  return e;
}
function txt(s){ return document.createTextNode(s); }

function render(){
  app.innerHTML = "";
  if (STATE.view === "landing") return renderLanding();
  if (STATE.view === "docente_login") return renderDocenteLogin();
  if (STATE.view === "docente_panel") return renderDocentePanel();
  if (STATE.view === "exam_intro") return renderExamIntro();
  if (STATE.view === "exam_form") return renderExamForm();
  if (STATE.view === "exam_done") return renderExamDone();
}

function renderLanding(){
  const head = el("div", {class:"toprow"}, [
    el("div", {}, [
      el("h1", {}, [txt("Pruebita Práctico Purificación")]),
      el("div", {class:"sub"}, [txt("Química Orgánica — Biología e Ingeniería Ambiental, FCEFyN-UNC")])
    ]),
    el("button", {class:"ghost"}, [txt("Modo docente")])
  ]);
  head.querySelector("button").onclick = () => { STATE.view = "docente_login"; render(); };
  app.appendChild(head);

  if (!CONFIG.APPS_SCRIPT_URL) {
    app.appendChild(el("div", {class:"notice warn"}, [txt(
      "⚠ Backend no configurado: las respuestas de los alumnos NO se van a guardar en ningún lado todavía. No uses esta página con una comisión real hasta configurar AppsScript_backend.gs y pegar la URL en CONFIG.APPS_SCRIPT_URL."
    )]));
  }

  const grid = el("div", {class:"grid"});
  Object.keys(EXAMS).map(Number).sort((a,b)=>a-b).forEach(id => {
    const enabled = !!ENABLED[id];
    const btn = el("button", {class:"com-btn", ...(enabled?{}:{disabled:"disabled"})}, [
      el("div", {}, [txt("Comisión " + id)]),
      el("span", {class:"badge " + (enabled?"on":"off")}, [txt(enabled ? "Habilitado" : "Deshabilitado")])
    ]);
    if (enabled) btn.onclick = () => { STATE.comision = id; STATE.view = "exam_intro"; render(); };
    grid.appendChild(btn);
  });
  app.appendChild(grid);
}

function renderDocenteLogin(){
  app.appendChild(el("button", {class:"backlink"}, [txt("← Volver")])).onclick = () => { STATE.view="landing"; render(); };
  const card = el("div", {class:"card"}, [
    el("h2", {}, [txt("Acceso docente")]),
    el("div", {class:"field"}, [
      el("label", {}, [txt("Clave")]),
      el("input", {type:"text", id:"pass"})
    ]),
    el("button", {class:"primary"}, [txt("Ingresar")])
  ]);
  card.querySelector("button").onclick = () => {
    const val = card.querySelector("#pass").value;
    if (val === CONFIG.DOCENTE_PASSCODE) { STATE.docente = true; STATE.view = "docente_panel"; render(); }
    else alert("Clave incorrecta.");
  };
  app.appendChild(card);
}

function renderDocentePanel(){
  const back = el("button", {class:"backlink"}, [txt("← Volver a la vista de alumno")]);
  back.onclick = () => { STATE.view="landing"; render(); };
  app.appendChild(back);

  app.appendChild(el("h1", {}, [txt("Panel docente")]));
  app.appendChild(el("div", {class:"sub"}, [txt("Habilitá o deshabilitá cada comisión. Los alumnos solo ven el botón activo cuando vos lo habilitás.")]));

  const card = el("div", {class:"card"});
  Object.keys(EXAMS).map(Number).sort((a,b)=>a-b).forEach(id => {
    const row = el("div", {class:"toggle-row"}, [
      el("div", {}, [txt("Comisión " + id + " (TEMA " + EXAMS[id].tema + ")")]),
      el("label", {class:"switch"}, [
        el("input", {type:"checkbox", ...(ENABLED[id]?{checked:"checked"}:{})}),
        el("span", {class:"slider"})
      ])
    ]);
    row.querySelector("input").onchange = async (ev) => {
      ENABLED[id] = ev.target.checked;
      await saveSharedConfig();
    };
    card.appendChild(row);
  });
  app.appendChild(card);

  app.appendChild(el("div", {class:"card"}, [
    el("h2", {}, [txt("Compartir con los alumnos")]),
    el("div", {class:"sub", html:"Copiá el link de esta página (la URL donde la tengas alojada) y armá el QR vos mismo con cualquier generador. Los alumnos abren el link, ven el botón de su comisión habilitado, y entran directo al examen."})
  ]));
}

function renderExamIntro(){
  const back = el("button", {class:"backlink"}, [txt("← Volver")]);
  back.onclick = () => { STATE.view="landing"; render(); };
  app.appendChild(back);
  const exam = EXAMS[STATE.comision];
  const card = el("div", {class:"card"}, [
    el("h2", {}, [txt("Comisión " + STATE.comision + " — Pruebita Práctico Purificación")]),
    el("div", {class:"sub"}, [txt("Total: 10 puntos — 5 ejercicios de 2 puntos cada uno.")]),
    el("div", {class:"field"}, [ el("label",{},[txt("Nombre y apellido")]), el("input",{type:"text", id:"nombre"}) ]),
    el("div", {class:"field"}, [ el("label",{},[txt("Número de alumno")]), el("input",{type:"text", id:"numero"}) ]),
    el("button", {class:"primary"}, [txt("Comenzar")])
  ]);
  card.querySelector("button").onclick = () => {
    const nombre = card.querySelector("#nombre").value.trim();
    const numero = card.querySelector("#numero").value.trim();
    if (!nombre || !numero) { alert("Completá nombre y número de alumno."); return; }
    STATE.answers = { _nombre: nombre, _numero: numero };
    STATE.view = "exam_form";
    render();
  };
  app.appendChild(card);
}

function renderExamForm(){
  const exam = EXAMS[STATE.comision];
  app.appendChild(el("h1", {}, [txt("Comisión " + STATE.comision + " — Pruebita Práctico Purificación")]));
  app.appendChild(el("div", {class:"sub"}, [txt(STATE.answers._nombre + " · N° " + STATE.answers._numero)]));

  const form = el("div", {class:"card"});
  exam.sections.forEach(sec => {
    const secDiv = el("div", {class:"qsection"});
    secDiv.appendChild(el("div", {class:"qtitle"}, [txt(sec.n + ") " + sec.intro + "  "), el("span",{class:"points"},[txt("(" + sec.points + " puntos)")])]));
    if (sec.graph) secDiv.appendChild(el("img", {class:"graph", src: GRAPH_SRC, alt:"Gráfico T vs composición"}));
    sec.fields.forEach(f => {
      if (f.type === "radio") {
        const radioBlock = el("div", {style:"margin-bottom:12px;"});
        if (f.label) radioBlock.appendChild(el("div", {style:"margin-bottom:4px;"}, [txt(f.label)]));
        (f.options||[]).forEach((opt) => {
          radioBlock.appendChild(el("label", {class:"opt"}, [
            el("input", {type:"radio", name:f.id, value:opt}),
            txt(opt)
          ]));
        });
        secDiv.appendChild(radioBlock);
      } else {
        const fieldDiv = el("div", {class:"field"});
        fieldDiv.appendChild(el("label", {}, [txt(f.label)]));
        fieldDiv.appendChild(el(f.type === "textarea" ? "textarea" : "input", {type:"text", "data-id":f.id}));
        secDiv.appendChild(fieldDiv);
      }
    });
    form.appendChild(secDiv);
  });

  const submitBtn = el("button", {class:"primary"}, [txt("Entregar")]);
  submitBtn.onclick = () => submitExam(form, exam);
  form.appendChild(el("div", {style:"margin-top:18px;"}, [submitBtn]));
  app.appendChild(form);
}

function collectAnswers(formEl, exam){
  const out = { _nombre: STATE.answers._nombre, _numero: STATE.answers._numero, comision: STATE.comision, tema: exam.tema, timestamp: new Date().toISOString() };
  exam.sections.forEach(sec => {
    sec.fields.forEach(f => {
      if (f.type === "radio") {
        const checked = formEl.querySelector('input[name="'+f.id+'"]:checked');
        out[f.id] = checked ? checked.value : "";
      } else {
        const inputEl = formEl.querySelector('[data-id="'+f.id+'"]');
        out[f.id] = inputEl ? inputEl.value : "";
      }
    });
  });
  return out;
}

async function submitExam(formEl, exam){
  const answers = collectAnswers(formEl, exam);
  let sentToBackend = false;
  if (CONFIG.APPS_SCRIPT_URL) {
    try {
      await fetch(CONFIG.APPS_SCRIPT_URL, {
        method:"POST", headers:{"Content-Type":"text/plain"},
        body: JSON.stringify({ action:"submitResponse", data: answers })
      });
      sentToBackend = true;
    } catch(e) { console.warn("No se pudo enviar al backend:", e); }
  }
  // Copia de resguardo oculta (no descargable por el alumno). Solo funciona si la página corre
  // dentro de un artifact de Claude con window.storage disponible; en GitHub Pages no existe,
  // así que la única vía confiable de guardado es CONFIG.APPS_SCRIPT_URL.
  if (window.storage) {
    try { await window.storage.set("respuesta_" + STATE.comision + "_" + STATE.answers._numero + "_" + Date.now(), JSON.stringify(answers), true); } catch(e){}
  }
  STATE.lastAnswers = answers;
  STATE.lastSentToBackend = sentToBackend;
  STATE.lastFormEl = formEl;
  STATE.lastExam = exam;
  STATE.view = "exam_done";
  render();
}

function renderExamDone(){
  if (STATE.lastSentToBackend || (!CONFIG.APPS_SCRIPT_URL && window.storage)) {
    app.appendChild(el("div", {class:"card"}, [
      el("h2", {}, [txt("¡Listo!")]),
      el("div", {class:"sub"}, [txt("Tu respuesta fue registrada. Ya podés cerrar esta página.")])
    ]));
    const backBtn = el("button", {class:"ghost"}, [txt("Volver al inicio")]);
    backBtn.onclick = () => { STATE.view="landing"; STATE.comision=null; render(); };
    app.appendChild(backBtn);
  } else {
    const card = el("div", {class:"card"}, [
      el("h2", {}, [txt("No se pudo guardar tu respuesta")]),
      el("div", {class:"notice warn"}, [txt("La plataforma todavía no está conectada a la planilla del docente, o hubo un problema de conexión. No cierres esta página: avisale a tu docente y probá de nuevo.")])
    ]);
    const retryBtn = el("button", {class:"primary"}, [txt("Reintentar envío")]);
    retryBtn.onclick = () => submitExam(STATE.lastFormEl, STATE.lastExam);
    card.appendChild(retryBtn);
    app.appendChild(card);
  }
}

tryLoadSharedConfig().then(render);
</script>
